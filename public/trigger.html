<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KLAB Referral Admin</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 640px;
            margin: 60px auto;
            padding: 20px;
            background: #f5f5f5;
        }

        h1 {
            color: #1a1a1a;
            font-size: 22px;
        }

        .card {
            background: white;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
        }

        h2 {
            font-size: 15px;
            margin: 0 0 8px;
        }

        p.desc {
            font-size: 13px;
            color: #666;
            margin: 0 0 14px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 16px;
        }

        button {
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 6px;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-blue {
            background: #2563eb;
        }

        .btn-blue:hover:not(:disabled) {
            background: #1d4ed8;
        }

        .btn-green {
            background: #16a34a;
        }

        .btn-green:hover:not(:disabled) {
            background: #15803d;
        }

        .btn-purple {
            background: #7c3aed;
        }

        .btn-purple:hover:not(:disabled) {
            background: #6d28d9;
        }

        .result {
            margin-top: 12px;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            white-space: pre-wrap;
            max-height: 260px;
            overflow-y: auto;
            display: none;
        }

        .success {
            background: #dcfce7;
            color: #166534;
            display: block;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            display: block;
        }

        .info {
            background: #dbeafe;
            color: #1e40af;
            display: block;
        }

        .progress {
            background: #f3f4f6;
            border-radius: 6px;
            height: 10px;
            margin: 10px 0;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            height: 100%;
            transition: width 0.3s;
        }

        .blue-bar {
            background: #2563eb;
        }

        .green-bar {
            background: #16a34a;
        }
    </style>
</head>

<body>
    <h1>KLAB Nutra — Referral Admin</h1>
